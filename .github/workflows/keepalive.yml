# Keeps the demo alive: Supabase pauses free projects after ~7 days with no
# database activity. /api/health runs SELECT 1, which counts as activity, and
# also wakes the Render service.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > Variables
#        add APP_URL = https://your-app.onrender.com
name: Keep alive

on:
  schedule:
    - cron: '0 1 */3 * *'   # every 3 days, 09:00 Manila time
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 120 \
            "${{ vars.APP_URL }}/api/health"
